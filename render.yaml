# Render Blueprint for Moe's OpenJarvis server (Stonepoint / Steelblue ops assistant).
# Drop this file at the ROOT of your fork, replacing the original render.yaml, then
# apply at: https://dashboard.render.com/blueprint/new?repo=https://github.com/<your-github-user>/OpenJarvis
services:
  - type: web
    name: openjarvis-server
    runtime: docker
    plan: starter            # $7/mo. Needed for the persistent disk below; "free" loses all state on restart.
    region: ohio             # closest Render region to Miami
    dockerfilePath: ./deploy/docker/Dockerfile
    dockerContext: .
    # Claude via the cloud engine. Render's dockerCommand REPLACES the Dockerfile ENTRYPOINT
    # (not just CMD), so it must start with the `jarvis` executable. It also does not expand
    # $PORT, so the port is pinned here AND in the PORT env var below - change both together.
    dockerCommand: openjarvis-entrypoint jarvis serve --host 0.0.0.0 --port 10000 --engine cloud --model claude-sonnet-4-6 --agent orchestrator
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: openjarvis-home
      mountPath: /home/openjarvis/.openjarvis   # config, memory, agent DB, connector tokens survive restarts
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: OPENJARVIS_HOME
        value: /home/openjarvis/.openjarvis
      # Bearer key clients must send on /v1/* and /api/* (server refuses 0.0.0.0 without it)
      - key: OPENJARVIS_API_KEY
        generateValue: true
      # --- secrets you paste in the Render dashboard (sync: false = asked at creation) ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER      # the Twilio number Jarvis texts/calls FROM, E.164 e.g. +17545550100
        sync: false
      - key: JARVIS_OWNER_PHONE       # YOUR mobile, E.164. The phone_call / send_sms tools default to this number.
        sync: false
      - key: JARVIS_VOICE_URL         # Twilio Function URL (…/voice) from twilio/voice-inbound.js; lets you talk back when Jarvis calls
        sync: false
      # --- Voice in the web app (dictation + spoken replies) ---
      - key: DEEPGRAM_API_KEY        # speech-to-text for the mic button
        sync: false
      - key: ELEVENLABS_API_KEY      # text-to-speech for spoken replies
        sync: false
      - key: ELEVENLABS_MODEL
        value: eleven_flash_v2_5     # lowest-latency ElevenLabs model; eleven_multilingual_v2 for max quality
      - key: ELEVENLABS_VOICE_ID
        value: xru6qZB94sJdkyqP12qN  # "James - English Butler" - same voice as the phone agent
      # --- Phone calls through the ElevenLabs conversational agent (real-time two-way) ---
      - key: ELEVENLABS_AGENT_ID
        value: agent_4501m771rtndesmtgemtc1hhjmy2
      - key: ELEVENLABS_AGENT_PHONE_NUMBER_ID
        value: phnum_4301m771sdjve518rvbb5e4985et
      - key: OPS_WEBHOOK_KEY          # shared secret the ElevenLabs agent sends on /webhooks/ops/query
        sync: false
      # --- iMessage via SendBlue (1:1 and group chats; answers when addressed "Jarvis ...") ---
      - key: SENDBLUE_API_KEY_ID
        sync: false
      - key: SENDBLUE_API_SECRET_KEY
        sync: false
      - key: SENDBLUE_FROM_NUMBER      # the SendBlue line, E.164
        sync: false
      - key: JARVIS_PARTNER_PHONE      # Maikl's cell, E.164 - allowed to talk to Jarvis on iMessage
        sync: false
      # --- Ops Portal (read-only access to the Supabase sp_docs table) ---
      - key: OPS_SUPABASE_URL
        value: https://pnepffdqptvrhoxcibzq.supabase.co
      - key: OPS_SUPABASE_ANON_KEY    # the project's public anon key (Supabase dashboard > Project Settings > API)
        sync: false
      - key: OPS_API_KEY              # the portal's x-ops-key (sp_config.api_key)
        sync: false
